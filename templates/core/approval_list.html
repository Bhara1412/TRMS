{% extends "base.html" %}{% block content %}<h2>Approval Workflow</h2><table class="table"><tr><th>Company</th><th>Tender</th><th>Stage</th><th></th></tr>{% for s in submissions %}<tr><td>{{ s.company }}</td><td>{{ s.tender }}</td><td>{{ s.get_status_display }}</td><td><a class="btn btn-sm btn-primary" href="{% url 'approval_workflow_detail' s.id %}">Open</a></td></tr>{% empty %}<tr><td colspan="4">No submissions awaiting approval.</td></tr>{% endfor %}</table>{% endblock %}
