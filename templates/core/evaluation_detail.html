{% extends "base.html" %}{% block content %}<h2>Evaluate Submission</h2><div class="card mb-3"><div class="card-body"><p><b>Company:</b> {{ submission.company }}</p><p><b>Tender:</b> {{ submission.tender }}</p><p><a href="{{ submission.proposal.url }}">Open proposal</a>{% if submission.supporting_document %} | <a href="{{ submission.supporting_document.url }}">Supporting document</a>{% endif %}</p></div></div><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Complete Evaluation</button></form>{% endblock %}
